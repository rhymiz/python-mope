name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Lint and check formatting
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Check types
        run: uv run --locked ty check
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --locked python - <<'PY'
          import os
          from importlib.metadata import version

          package_version = version("python-mope")
          tag = os.environ["RELEASE_TAG"]
          if tag not in {package_version, f"v{package_version}"}:
              raise SystemExit(f"Release tag {tag!r} does not match {package_version}")
          PY
      - name: Build distributions
        run: uv build --no-sources
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Install dependencies and built wheel
        run: |
          uv sync --locked
          uv pip install --no-deps --reinstall dist/*.whl
      - name: Test installed package
        run: uv run --no-sync python -I -m pytest
      - name: Check installed type information
        run: |
          mkdir -p "$RUNNER_TEMP/mope-consumer"
          cp tests/typing.py "$RUNNER_TEMP/mope-consumer/consumer.py"
          uv run --no-sync ty check --project "$RUNNER_TEMP/mope-consumer" --python "$PWD/.venv"
