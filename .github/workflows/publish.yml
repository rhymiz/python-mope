name: publish package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/build.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/python-mope/
    permissions:
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.8"
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
